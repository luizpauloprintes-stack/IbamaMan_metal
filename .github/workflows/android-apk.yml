name: Build APK (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IbamaMan-Guardiao-da-Amazonia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IbamaMan-Guardiao-da-Amazonia-apk
          path: IbamaMan-Guardiao-da-Amazonia.apk

      - name: Publicar release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IbamaMan: Guardião da Amazônia — build ${{ github.run_number }}
          body: |
            APK de teste (debug) gerado automaticamente a partir de ${{ github.sha }}.
            Baixe o arquivo IbamaMan-Guardiao-da-Amazonia.apk no celular e instale (permita "fontes desconhecidas").
          files: IbamaMan-Guardiao-da-Amazonia.apk
          make_latest: true
